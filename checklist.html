        }

            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;

            color: #333;
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px;
            background: #fff;
        }

        h1 {
            color: var(--primary-green);
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5rem;
        }

        .search-container {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 20px;
            background: var(--light-bg);
            padding: 20px;
            border-radius: 10px;
        }

        .filter-select {
            padding: 12px;
            border-radius: 8px;
            border: 2px solid var(--primary-green);
            min-width: 200px;
            cursor: pointer;
            background: white;
            font-size: 14px;
        }

        .filter-select:hover {
            border-color: #1b5e20;
        }

        .filter-select:focus {
            outline: none;
            box-shadow: 0 0 0 2px rgba(46, 125, 50, 0.2);
        }

        .clear-filters-btn {
            padding: 12px 25px;
            border-radius: 8px;
            border: none;
            background: var(--primary-green);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 14px;
        }

        .clear-filters-btn:hover {
            background: #1b5e20;
        }

        #resultsCount {
            text-align: center;
            margin-bottom: 20px;
            font-weight: bold;
            color: var(--primary-green);
            font-size: 1.2rem;
            padding: 12px;
            background: #e8f5e9;
            border-radius: 30px;
        }

        .map-controls {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: white;
            padding: 5px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            display: flex;
            gap: 5px;
        }

        .map-toggle-btn {
            padding: 8px 15px;
            border: 2px solid var(--primary-green);
            background: white;
            color: var(--primary-green);
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 13px;
        }

        .map-toggle-btn.active {
            background: var(--primary-green);
            color: white;
        }

        .map-toggle-btn:hover {
            background: var(--primary-green);
            color: white;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1.2fr 1.8fr; /* Map gets more space */
            gap: 25px;
            margin-top: 20px;
            position: relative;
        }

        .map-container {
            position: relative;
        }

        #map {
            height: 750px; /* Increased from 650px */
            width: 100%;
            border-radius: 10px;
            box-shadow: var(--card-shadow);
            border: 3px solid var(--primary-green);
            position: sticky;
            top: 20px;
            z-index: 1;
        }

        .results-container {
            max-height: 750px; /* Increased to match map */
            overflow-y: auto;
            padding-right: 15px;
        }

        .results-container::-webkit-scrollbar {
            width: 10px;
        }

        .results-container::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .results-container::-webkit-scrollbar-thumb {
            background: var(--primary-green);
            border-radius: 10px;
        }

        .results-container::-webkit-scrollbar-thumb:hover {
            background: #1b5e20;
        }

        .species-card {
            background: var(--light-bg);
            border-left: 4px solid var(--primary-green);
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 0 8px 8px 0;
            box-shadow: var(--card-shadow);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }

        .species-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            border-left-width: 6px;
        }

        .species-card.active {
            background: #e8f5e9;
            border-left-color: #1b5e20;
            border-left-width: 6px;
        }

        .taxa-path {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .species-name {
            font-size: 1.4em;
            font-weight: bold;
            margin-bottom: 15px;
            color: #1b5e20;
            border-bottom: 1px solid #ddd;
            padding-bottom: 5px;
        }

        .species-name i {
            font-style: italic;
        }

        .detail-label {
            font-weight: bold;
            color: var(--primary-green);
            display: inline-block;
            min-width: 130px;
            font-size: 0.95rem;
        }

        .detail-row {
            margin: 8px 0;
            line-height: 1.5;
            font-size: 0.95rem;
        }

            background: #fff;
            border: 1px solid var(--primary-green);
            border-radius: 20px;
            padding: 5px 15px;
            font-size: 0.9em;
            color: var(--primary-green);
            display: inline-block;
            margin-top: 12px;
            font-weight: 600;
        }

            text-align: center;
            color: #666;
            padding: 50px;
            font-style: italic;
            font-size: 1.1rem;
        }

            font-family: inherit;
            min-width: 250px;
            font-size: 0.95rem;
        }

        .leaflet-popup-content strong {
            color: var(--primary-green);
            font-size: 1.1rem;
        }

    // Initialize map with both street and satellite layers
    function initMap() {
        map = L.map('map').setView([28.3949, 84.1240], 7); // Center on Nepal
        
        // Street layer (OpenStreetMap)
        streetLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
            maxZoom: 19
        });
        
        // Satellite layer (Esri World Imagery)
        satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community',
            maxZoom: 18
        });
        
        // Start with street view
        streetLayer.addTo(map);
    }

    // Toggle between street and satellite view
    function toggleMapLayer(layer) {
        if (layer === currentLayer) return;
        
        // Remove current layer
        if (currentLayer === 'street') {
            map.removeLayer(streetLayer);
        } else {
            map.removeLayer(satelliteLayer);
        }
        
        // Update button states
        document.getElementById('streetBtn').classList.remove('active');
        document.getElementById('satelliteBtn').classList.remove('active');
        
        // Add new layer
        if (layer === 'street') {
            streetLayer.addTo(map);
            document.getElementById('streetBtn').classList.add('active');
            currentLayer = 'street';
        } else {
            satelliteLayer.addTo(map);
            document.getElementById('satelliteBtn').classList.add('active');
            currentLayer = 'satellite';
        }
        
        // Re-add markers if any exist
        if (markers.length > 0) {
            markers.forEach(marker => marker.addTo(map));
        }
    }

    // Clear all markers from map
    function clearMarkers() {
        if (markers.length > 0) {
            markers.forEach(marker => map.removeLayer(marker));
            markers = [];
        }
    }

    // Add markers for selected species
    function addMarkersForSpecies(order, family, genus, species) {
        clearMarkers();
        
        const filteredPoints = millipedePoints.filter(point => 
            (order === 'all' || point.order === order) &&
            (family === 'all' || point.family === family) &&
            (genus === 'all' || point.genus === genus) &&
            (species === 'all' || point.species === species)
        );

        if (filteredPoints.length === 0) {
            return;
        }

        // Create bounds to fit all markers
        const bounds = [];
        
        filteredPoints.forEach(point => {
            if (point.lat && point.lon) {
                const marker = L.marker([point.lat, point.lon]).addTo(map);
                
                // Create popup with species info
                const popupContent = `
                    <strong>${point.genus} ${point.species}</strong><br>
                    <em>${point.family}</em><br>
                    <b>Location:</b> ${point.location}<br>
                    <small>📍 ${point.lat.toFixed(4)}°N, ${point.lon.toFixed(4)}°E</small>
                `;
                
                marker.bindPopup(popupContent);
                
                marker.on('click', () => {
                    // Highlight corresponding card if it exists
                    const cardId = `${point.genus}_${point.species}`.replace(/\s+/g, '-').toLowerCase();
                    const card = document.getElementById(cardId);
                    if (card) {
                        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        if (currentActiveCard) {
                            currentActiveCard.classList.remove('active');
                        }
                        card.classList.add('active');
                        currentActiveCard = card;
                    }
                });
                
                markers.push(marker);
                bounds.push([point.lat, point.lon]);
            }
        });

        // Fit map to show all markers
        if (bounds.length > 0) {
            map.fitBounds(bounds, { padding: [50, 50] });
        }
    }
