<main>

    </div>
    
    <!-- Gallery Grid -->

        <!-- Gallery items will be added here by JavaScript -->

    <!-- Lightbox Modal -->

        <span class="close-modal">&times;</span>
        <button class="nav-btn prev-btn" id="prevBtn">❮</button>
        <button class="nav-btn next-btn" id="nextBtn">❯</button>

<script>
    // Fieldwork Gallery Data - All photos with categories

        { id: 1, image: 'forest_dang.jpg', caption: 'Forest of <i>Shorea robusta</i> in Dang Valley', location: 'Dang Valley, Western Nepal', date: '**', category: 'habitat' },

        { id: 3, image: 'habitat3.jpg', caption: 'Mixed Forest Leaf litter, perfect habitat for Millipede and other Invertebrates', location: 'Dang Valley, Western Nepal', date: '**', category: 'habitat' },
        { id: 4, image: 'habitat4.jpg', caption: '<i>Shorea robusta</i> Forest', location: 'Dang Valley, Western Nepal', date: '*', category: 'habitat' },
        { id: 5, image: 'lab1.jpg', caption: 'Lokendra Chand and Ayub Senchury in Lab', location: 'Central Department of Zoology, Tribhuvan University, Kathmandu, Nepal', date: '2023 AD', category: 'lab' },

        { id: 7, image: 'gono_dead.jpg', caption: '<i>Gonoplectus malayus</i> after death in the forest floor', location: 'Dang Valley, Western Nepal', date: '2023 AD', category: 'specimen' },

        { id: 10, image: 'siphono2.jpg', caption: '<i>Siphonorhinus</i> sp.', location: 'Dang Valley, Western Nepal', date: '2024 AD', category: 'specimen' },
        { id: 11, image: 'students2.jpg', caption: 'Students searching for soil invertebrates in Dang, Nepal', location: 'Dang Valley, Western Nepal', date: '2024 AD', category: 'fieldwork' },
        { id: 12, image: 'chon2.jpg', caption: '<i>Chondromorpha sp.</i> under the soil, Exposed after digging', location: 'Dang Valley, Western Nepal', date: '2024 AD', category: 'specimen' },
        { id: 13, image: 'chondro1.jpg', caption: '<i>Chondromorpha sp.</i> in the maize growing land', location: 'Dang Valley, Western Nepal', date: '2025 AD', category: 'specimen' },
        { id: 14, image: 'cmating3.jpg', caption: '<i>Chondromorpha sp.</i> mating', location: 'Surrounding Hill, Dang Valley, Western Nepal', date: '2025 AD', category: 'specimen' },
        { id: 15, image: 'crypto1.jpg', caption: '<i>Cryptocorypha</i> sp.', location: 'Dang Valley, Western Nepal', date: '2025 AD', category: 'specimen' },
        { id: 16, image: 'delarthrum.jpg', caption: '<i>Delarthrum elegans</i> (Golovatch, 1992)', location: 'Kathmandu Valley, Nepal', date: '*', category: 'specimen' },
        { id: 17, image: 'gono2.jpg', caption: '<i>Gonoplectus</i> sp.', location: 'Dang Valley, Western Nepal', date: '2025 AD', category: 'specimen' },
        { id: 18, image: 'gono3.jpg', caption: '<i>Gonoplectus</i> sp.', location: 'Salyan district, Western Nepal', date: '*', category: 'specimen' },
        { id: 19, image: 'gono4.jpg', caption: '<i>Gonoplectus</i> sp.', location: 'Kathmandu Valley, Nepal', date: '2022 AD', category: 'specimen' },
        { id: 20, image: 'gono5.jpg', caption: '<i>Gonoplectus</i> sp.', location: 'Kathmandu Valley, Nepal', date: '2022 AD', category: 'specimen' },
        { id: 21, image: 'gonopod_.jpg', caption: 'Gonopod of <i>Gonoplectus</i> sp.', location: 'Dang Valley, Western Nepal', date: '2025 AD', category: 'specimen' },
        { id: 22, image: 'malayus.jpg', caption: '<i>Gonoplectus lindbergi</i> Demange 1961', location: 'Jhapa district, Eastern Nepal', date: '*', category: 'specimen' },
        { id: 23, image: 'milli1.jpg', caption: 'Millipedes under the leaf litter', location: 'Dang Valley, Western Nepal', date: '2025 AD', category: 'specimen' },
        { id: 24, image: 'sphae2.jpg', caption: 'Giant pill millipede', location: 'Dang Valley, Western Nepal', date: '2025 AD', category: 'specimen' },
        { id: 25, image: 'orthomorpha1.jpg', caption: '<i>Orthomorpha coarctata</i> (Saussure, 1860)', location: 'Dang Valley, Western Nepal', date: '2025 AD', category: 'specimen' }
    ];
    
    // Get the gallery container
    const galleryGrid = document.getElementById('gallery-grid');
    
    // Modal elements
    const modal = document.getElementById('imageModal');
    const modalImg = document.getElementById('modalImage');
    const modalCaption = document.getElementById('modalCaption');
    const closeModal = document.querySelector('.close-modal');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    
    let currentImageIndex = 0;
    let currentFilter = 'all';
    
    // Function to render the gallery
    function renderGallery(filter = 'all') {
        const filteredData = filter === 'all' 
            ? galleryData 
            : galleryData.filter(item => item.category === filter);
        
        galleryGrid.innerHTML = filteredData.map((item, index) => `
            <div class="gallery-item" data-index="${index}" data-filter="${filter}">
                <img src="${item.image}" alt="${item.caption.replace(/<[^>]*>/g, '')}" class="gallery-image" onerror="this.src='https://via.placeholder.com/600x400?text=Fieldwork+Photo'">
                <div class="gallery-caption-static">
                    <p>${item.caption}</p>
                    <div class="gallery-location">
                        <span>📍</span> ${item.location} | ${item.date}
                    </div>
                </div>
            </div>
        `).join('');
        
        // Add click event to each gallery item
        document.querySelectorAll('.gallery-item').forEach((item, idx) => {
            item.addEventListener('click', function() {
                const filter = this.dataset.filter;
                const filtered = filter === 'all' ? galleryData : galleryData.filter(i => i.category === filter);
                currentImageIndex = parseInt(this.dataset.index);
                const imageData = filtered[currentImageIndex];
                openModal(imageData);
            });
        });
    }
    
    // Function to open modal
    function openModal(imageData) {
        modal.style.display = 'block';
        modalImg.src = imageData.image;
        modalCaption.innerHTML = `
            ${imageData.caption}<br>
            <span class="modal-location">📍 ${imageData.location} | ${imageData.date}</span>
        `;
        
        modalImg.onerror = function() {
            this.src = 'https://via.placeholder.com/800x600?text=Image+Not+Found';
        };
        
        updateNavButtons();
    }
    
    // Navigate to previous image
    function prevImage() {
        const filtered = currentFilter === 'all' 
            ? galleryData 
            : galleryData.filter(i => i.category === currentFilter);
        
        currentImageIndex = (currentImageIndex - 1 + filtered.length) % filtered.length;
        openModal(filtered[currentImageIndex]);
    }
    
    // Navigate to next image
    function nextImage() {
        const filtered = currentFilter === 'all' 
            ? galleryData 
            : galleryData.filter(i => i.category === currentFilter);
        
        currentImageIndex = (currentImageIndex + 1) % filtered.length;
        openModal(filtered[currentImageIndex]);
    }
    
    // Update navigation buttons visibility
    function updateNavButtons() {
        const filtered = currentFilter === 'all' 
            ? galleryData 
            : galleryData.filter(i => i.category === currentFilter);
        
        if (filtered.length <= 1) {
            prevBtn.style.display = 'none';
            nextBtn.style.display = 'none';
        } else {
            prevBtn.style.display = 'block';
            nextBtn.style.display = 'block';
        }
    }
    
    // Filter functionality
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentFilter = this.dataset.filter;
            renderGallery(currentFilter);
        });
    });
    
    // Close modal when clicking X
    closeModal.addEventListener('click', function() {
        modal.style.display = 'none';
    });
    
    // Close modal when clicking outside the image
    window.addEventListener('click', function(event) {
        if (event.target === modal) {
            modal.style.display = 'none';
        }
    });
    
    // Close modal with Escape key
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && modal.style.display === 'block') {
            modal.style.display = 'none';
        }
        if (e.key === 'ArrowLeft' && modal.style.display === 'block') {
            prevImage();
        }
        if (e.key === 'ArrowRight' && modal.style.display === 'block') {
            nextImage();
        }
    });
    
    // Navigation buttons
    prevBtn.addEventListener('click', prevImage);
    nextBtn.addEventListener('click', nextImage);
    
    // Initialize gallery
    renderGallery('all');
</script>

</body>
</html>
