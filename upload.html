<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Finding - Millipedes of Nepal</title>
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* If your style.css isn't loading, these manual colors will ensure it works */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f4; margin: 0; padding: 0; }
        
        header { background: #2d5a27; color: white; padding: 20px; text-align: center; }

        .upload-container {
            max-width: 700px;
            margin: 40px auto;
            background: #fff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-top: 5px solid #2d5a27;
        }

        .form-header h2 { color: #2d5a27; margin-top: 0; }
        
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 8px; color: #5d4037; }
        
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box; /* Crucial for layout */
        }

        .file-upload {
            background: #f0f7f0;
            padding: 20px;
            border: 2px dashed #4a7c44;
            text-align: center;
            border-radius: 8px;
        }

        .submit-btn {
            background: #2d5a27;
            color: white;
            padding: 15px;
            border: none;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
        }

        .submit-btn:hover { background: #4a7c44; }
        
        .note { font-size: 0.85rem; color: #666; margin-top: 15px; text-align: center; }
    </style>
</head>
<body>

<header>
    <h1>Citizen Science Portal</h1>
    <p>Contribute your observations to our database</p>
</header>

<main>
    <div class="upload-container">
        <div class="form-header">
            <h2>Submit Your Observation</h2>
            <p>Your contribution helps us map the biodiversity of Nepal.</p>
        </div>

        <form action="https://formspree.io/f/mqakpjne" method="POST" enctype="multipart/form-data">
            
            <div class="form-group">
                <label>Contributor Name</label>
                <input type="text" name="name" required>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" required>
            </div>

            <div class="form-group">
                <label>Observation Location</label>
                <input type="text" name="location" placeholder="e.g. Dang Valley" required>
            </div>

            <div class="form-group">
                <label>Upload Photo</label>
                <div class="file-upload">
                    <input type="file" name="upload" accept="image/*" required>
                </div>
            </div>

            <button type="submit" class="submit-btn">Send to Research Team</button>
            <p class="note">Check your email after submitting; you may need to confirm the first one!</p>
        </form>
    </div>
</main>

</body>
</html>
